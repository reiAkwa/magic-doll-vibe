# interface
"ui.background" = "bg1"
"ui.background.separator" = { bg = "bg2" }
"ui.text" = "txt1"
"ui.text.focus" = { bg = "bg2" }
"ui.text.inactive" = "comm"
"ui.text.directory" = "acc1"

"ui.gutter" = "bg1"
"ui.gutter.selected" = { fg = "acc1" }

"ui.cursor" = { fg = "txt2", bg = "acc1" }
"ui.cursor.match" = { fg = "txt2", bg = "green" }
"ui.selection" = { bg = "acc2" }
"ui.selection.primary" = { bg = "acc1" }

# cursor line
"ui.cursorline.primary" = { bg = "bg2" }
"ui.cursorline.secondary" = { bg = "bg2" }

# search / debug highlight
"ui.highlight" = { fg = "txt1", bg = "yellow" }
"ui.highlight.frameline" = { bg = "err" }

# lines
"ui.linenr" = "comm"
"ui.linenr.selected" = "acc1"

# virtual
"ui.virtual.indent-guide" = "gray"
"ui.virtual.whitespace" = "gray"
"ui.virtual.ruler" = "gray"
"ui.virtual.inlay-hint" = { fg = "comm", modifiers = ["dim"] }
"ui.virtual.jump-label" = { fg = "txt2", bg = "acc1" }
"ui.virtual.wrap" = "comm"

# status line

"ui.statusline" = { fg = "txt2", bg = "acc2" }
"ui.statusline.normal" = { fg = "txt2", bg = "blue" }
"ui.statusline.insert" = { fg = "txt2", bg = "red" }
"ui.statusline.select" = { fg = "txt2", bg = "green" }
"ui.statusline.inactive" = { fg = "txt1", bg = "bg2" }
"ui.statusline.separator" = "comm"

# buffer line
"ui.bufferline" = { fg = "txt2", bg = "acc2" }
"ui.bufferline.active" = { fg = "txt2", bg = "acc1" }
"ui.bufferline.background" = { fg = "txt1", bg = "bg2" }

# windows
"ui.popup" = { bg = "bg2" }
"ui.help" = { bg = "bg2" }
"ui.window" = "comm"

# menu
"ui.menu" = { bg = "bg2" }
"ui.menu.selected" = { fg = "txt2", bg = "acc2" }
"ui.menu.scroll" = { fg = "acc1", bg = "bg2" }

# picker
"ui.picker.header" = { fg = "comm" }
"ui.picker.header.column" = { fg = "comm" }
"ui.picker.header.column.active" = "acc1"

# debug
"ui.debug.breakpoint" = { fg = "err" }
"ui.debug.active" = { bg = "info" }

# hints
warning = "warn"
error = "err"
info = "info"
hint = "hint"

# diagnostic
# legacy
"diagnostic" = { fg = "black", bg = "red", underline = { color = "red", style = "curl" } }
"diagnostic.hint" = { fg = "black", bg = "cyan", underline = { color = "cyan", style = "line" } }
"diagnostic.info" = { fg = "black", bg = "green", underline = { color = "green", style = "line" } } 
"diagnostic.warning" = { fg = "black", bg = "yellow", underline = { color = "yellow", style = "curl" } }
"diagnostic.error" = { fg = "black", bg = "red", underline = { color = "red", style = "curl" } }
"diagnostic.unnecessary" = { fg = "comm", modifiers = ["dim"] }
"diagnostic.deprecated" = { underline = { color = "comm", style = "line" } }

# code
string = "str"
"constant.numeric" = "num"
comment = { fg = "comm", modifiers = ["italic"] }

type = "acc1"
"type.builtin" = { fg = "acc1", modifiers = ["italic"] }

variable = "acc2"
constant = "acc3"
"variable.builtin" = { fg = "acc2", modifiers = ["italic"] }
function = "acc2"
"function.builtin" = { fg = "acc2", modifiers = ["italic"] }
constructor = "acc2"

tag = "acc3"
"tag.builtin" = { fg = "acc3", modifiers = ["italic"] }

keyword = { fg = "acc3", modifiers = ["italic"] }
namespace = "acc3"
label = "acc3"

"diff.plus" = { bg = "info" }
"diff.minus" = { bg = "err" }

# rainbow brackets (nesting levels, cycle)
rainbow = [
  "acc1", # 0  blue
  "acc3", # 1  purple
  "str",  # 2  green
  "num",  # 3  gold
  "err",  # 4  rose
  "gray", # 5  neutral
]

[palette]
bg1 = "#f0f8ff"
bg2 = "#dae2e9"

txt1 = "#3b3b3b"
txt2 = "#1f2f3a"

acc1 = "#56a0d1"
acc2 = "#5b7f92"
acc3 = "#8868ae" # purple

str = "#4f7a6a"
num = "#a57a2e"

comm = "#787878"

warn = "#b58532"
err = "#a56a83"
info = "#4f7a6a"
hint = "#5b7f92"

red = "#C998AE"
green = "#7FAD9C"
yellow = "#CFB886"
blue = "#56A0D1"
magenta = "#CBA0E3"
cyan = "#789eb1"
gray = "#a8b4c0"

# light-*: same lightness as base, higher chroma (vivid emphasis tier,
# stays legible on a light bg unlike paler values)
light-red = "#DC8AB1"
light-green = "#59B698"
light-yellow = "#D8B260"
light-blue = "#2EA2E5"
light-magenta = "#CC97F3"
light-cyan = "#56A3C4"
light-gray = "#BAC6D1"

# TODO: dim colors
